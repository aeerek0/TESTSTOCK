<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Investment Goals</title>


<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
rel="stylesheet">


</head>


<body>


<div class="container-fluid p-3">


<!-- Header -->

<div class="card mb-3 shadow-sm">

    <div class="card-body text-center">

        <h3>
            🎯 Investment Goals
        </h3>

        <p class="text-muted mb-0">
            Track your investment journey
        </p>

    </div>

</div>



<!-- Summary -->

<div class="row g-3">


<div class="col-12 col-md-6">

<div class="card shadow-sm">

<div class="card-body">


<h6>
💰 Portfolio Goal
</h6>


<h2 id="portfolioGoalValue">
0
</h2>


<p class="text-muted">
เป้าหมายมูลค่าพอร์ต
</p>


<div class="progress">

<div 
id="portfolioProgress"
class="progress-bar"
style="width:0%">
</div>


</div>


<p class="mt-2">

<span id="portfolioPercent">
0
</span> %

</p>


</div>

</div>

</div>




<div class="col-12 col-md-6">


<div class="card shadow-sm">


<div class="card-body">


<h6>
💰 Dividend Goal
</h6>


<h2 id="dividendGoalValue">
0
</h2>


<p class="text-muted">
เป้าหมายเงินปันผลต่อปี
</p>


<div class="progress">

<div 
id="dividendProgress"
class="progress-bar bg-success"
style="width:0%">
</div>

</div>


<p class="mt-2">

<span id="dividendPercent">
0
</span> %

</p>


</div>


</div>


</div>


</div>





<!-- Goal Setting -->


<div class="card mt-3 shadow-sm">


<div class="card-body">


<h5>
⚙️ Goal Setting
</h5>



<div class="mb-3">

<label>
เป้าหมายมูลค่าพอร์ต
</label>


<input 
type="number"
class="form-control"
id="inputPortfolioGoal"
placeholder="เช่น 1000000">


</div>



<div class="mb-3">

<label>
เป้าหมายปันผลต่อปี
</label>


<input 
type="number"
class="form-control"
id="inputDividendGoal"
placeholder="เช่น 100000">


</div>



<button 
class="btn btn-primary"
onclick="saveGoals()">

💾 บันทึกเป้าหมาย

</button>


</div>

</div>



</div>


<script src="goals.js"></script>


</body>

</html>
